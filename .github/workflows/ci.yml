name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release this commit even if nothing in RELEASE_PATHS changed since the last release
        type: boolean
        default: false

# Least privilege for the built-in token: read-only by default, and widened
# only on the job that tags a release.
permissions:
  contents: read

# bash, so GitHub runs every step with -eo pipefail: a command that fails on
# the left of a pipe fails the step rather than handing on what it printed.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise.toml is the one place Go's version is pinned, for CI and for
      # anyone working on this locally.
      - uses: jdx/mise-action@v5

      # gofmt, vet on four architectures, and the tests natively and on 386.
      # The hosted runner is a real Linux host with cgroup2, so sockdiag's
      # kernel tests run here rather than skip. conntrack's need CAP_NET_ADMIN,
      # which the runner's user lacks, so they skip on EPERM.
      - name: mise run check
        run: mise run check

  # Whether this commit is a release: only if what a release carries
  # (RELEASE_PATHS in mise.toml: the Go source and the modules' requirements)
  # changed since the last release tag, so a change to the workflows, the
  # README or the toolchain pin tags nothing. A dispatch with `release`
  # forces one.
  due:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.due.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - id: due
        env:
          FORCE: ${{ inputs.release }}
        run: |
          if [ "$FORCE" = true ] || mise run -q release-due; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # A release is the root module tagged v<version> and dbusx tagged
  # dbusx/v<version>, at the same commit, so an application takes both at the
  # same version and nothing needs bumping by hand.
  release:
    runs-on: ubuntu-latest
    needs: [check, due]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.due.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      # The whole history, because the version's minor is the commit count;
      # ./run refuses a shallow clone rather than tag a wrong version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: echo "value=$(./run version)" >> "$GITHUB_OUTPUT"

      # A re-run has the same run number and so the same version, so the tags
      # may already be there: left alone if they name this commit, and the job
      # fails if they name another, since a version means one commit.
      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "v$VERSION" "dbusx/v$VERSION"; do
            if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
              [ "$existing" = "$GITHUB_SHA" ] || { echo "$tag already names $existing"; exit 1; }
            else
              git tag -a -m "$tag" "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          done

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" >/dev/null 2>&1 || {
            # The notes are the commits since the last release.
            if prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null); then
              git log "$prev..$GITHUB_SHA" --pretty='- %s (%h)' > notes.md
            else
              git log -1 --pretty='- %s (%h)' "$GITHUB_SHA" > notes.md
            fi
            gh release create "$tag" --verify-tag --title "$tag" --latest --notes-file notes.md
          }

      # Asking the module proxy for each version fetches it now. The proxy
      # caches a "not found" for a while, so the first lookup must come after
      # the tag exists, not from an application racing it.
      - name: Warm the module proxy
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for module in gokit gokit/dbusx; do
            curl -fsS "https://proxy.golang.org/github.com/danielbodart/$module/@v/v$VERSION.info"
            echo
          done
