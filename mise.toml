# The toolchain, pinned to the patch, for CI and for anyone working on this.
# The weekly update (.github/workflows/update.yml) moves each tool to the
# latest patch of its minor; a minor moves by hand, with the go_1_NN the
# applications' flakes build with from nixos-26.05.
[tools]
go = "1.27.3"

# What a release carries: the Go source and the modules' requirements. A
# change to any of these since the last release tag is released (see
# release-due); mise.toml is not among them, since an application builds
# gokit with its own Go.
[env]
RELEASE_PATHS = "*.go go.mod dbusx/go.mod dbusx/go.sum MAJOR"

[tasks.check]
description = "gofmt, vet and the tests, in both modules"
depends = ["lint", "test"]

[tasks.lint]
description = "gofmt, and vet on amd64, arm, arm64 and 386, in both modules"
run = "./run check"

[tasks.test]
description = "The tests in both modules, natively and on 386"
run = "./run test"

[tasks.build]
description = "Build every package of both modules"
run = "./run build"

[tasks.release-due]
description = "Print true if anything in RELEASE_PATHS changed since the last release tag, else false"
run = '''
set -f
last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null) || { echo true; exit 0; }
if [ -n "$(git diff --name-only "$last" HEAD -- $RELEASE_PATHS)" ]; then echo true; else echo false; fi
'''
